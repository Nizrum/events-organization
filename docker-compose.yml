services:
    db:
        build: ./db
        container_name: event_app_db
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: event_app
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - event_network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build: ./backend
        container_name: event_app_backend
        ports:
            - "8000:8000"
        environment:
            DATABASE_URL: postgresql://postgres:postgres@db:5432/event_app
            SECRET_KEY: qYl7CV1rEcxo7YLjfTnI6RnqlChxbYTq2c6bm1p3SxX
            ALGORITHM: HS256
            ACCESS_TOKEN_EXPIRE_MINUTES: 30
        depends_on:
            db:
                condition: service_healthy
        networks:
            - event_network
        volumes:
            - ./backend:/app

    frontend:
        build: ./frontend
        container_name: event_app_frontend
        ports:
            - "80:80"
        environment:
            BACKEND_URL: http://backend:8000
        depends_on:
            - backend
        networks:
            - event_network

networks:
    event_network:
        driver: bridge

volumes:
    postgres_data:
